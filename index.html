<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>单词纠音</title>
<style>
  :root{
    --ink:#1d1d1f; --ink2:#6e6e73; --ink3:#86868b;
    --line:rgba(0,0,0,.08); --hair:rgba(0,0,0,.055);
    --bg:#ffffff; --soft:#f5f5f7;
    --blue:#0071e3; --ok:#0a7c3d; --bad:#d70015;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font:16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",
         "PingFang SC","Microsoft YaHei",sans-serif;
    letter-spacing:-.01em;
    padding:env(safe-area-inset-top) env(safe-area-inset-right)
            env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:620px;margin:0 auto;padding:28px 20px 56px}

  header{padding:8px 0 22px}
  h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-.02em}
  .lead{color:var(--ink3);font-size:13.5px;margin-top:3px}

  /* 课程横向滑动 */
  .lessons{
    display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;
    scrollbar-width:none;-ms-overflow-style:none;
    scroll-snap-type:x proximity;
  }
  .lessons::-webkit-scrollbar{display:none}
  .chip{
    flex:0 0 auto;scroll-snap-align:start;
    font:inherit;font-size:13.5px;line-height:1;
    padding:9px 15px;border-radius:100px;border:1px solid var(--line);
    background:transparent;color:var(--ink2);cursor:pointer;
    transition:background .18s,border-color .18s,color .18s,
               transform .2s cubic-bezier(.3,1.4,.5,1);
  }
  .chip:active{transform:scale(.95)}
  .chip.on{background:var(--ink);border-color:var(--ink);color:#fff}

  /* 主舞台 */
  .stage{text-align:center;padding:26px 0 4px}
  .kanji{
    display:block;font-size:clamp(36px,11vw,52px);font-weight:600;
    letter-spacing:.02em;line-height:1.12;
  }
  .kana{
    display:block;font-size:17px;color:var(--ink3);margin-top:10px;
    letter-spacing:.06em;
  }
  .acc{
    display:inline-block;margin-top:14px;font-size:12px;color:var(--ink3);
    letter-spacing:.04em;
  }
  .morae{
    display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;
    margin-top:18px;color:var(--ink2);font-size:15px;letter-spacing:.04em;
  }
  .morae b{font-weight:400}
  .morae .cnt{color:var(--ink3);font-size:13px}

  .actions{display:flex;gap:10px;justify-content:center;margin-top:30px;flex-wrap:wrap}
  button{
    font-family:inherit;cursor:pointer;
    transition:opacity .16s,background .22s,border-color .22s,color .22s,
               transform .2s cubic-bezier(.3,1.4,.5,1);
  }
  button:active{opacity:.72;transform:scale(.96)}
  .primary:active{transform:scale(.975)}
  .primary{
    font-size:16px;font-weight:500;padding:14px 40px;border-radius:100px;
    border:none;background:var(--ink);color:#fff;letter-spacing:-.01em;
  }
  .primary.live{background:var(--bad)}
  .secondary{
    font-size:15px;padding:13px 22px;border-radius:100px;
    border:1px solid var(--line);background:transparent;color:var(--ink);
  }
  .status{display:block;margin-top:16px;font-size:13.5px;color:var(--ink3);min-height:20px}
  .status.err{color:var(--bad)}

  /* 录音电平 */
  #meterWrap{display:none;margin-top:22px;text-align:left}
  #meterWrap.on{display:block}
  .meterTop{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--bad);margin-bottom:8px}
  .pulse{width:7px;height:7px;border-radius:50%;background:var(--bad);animation:pl 1.1s infinite}
  @keyframes pl{0%,100%{opacity:1}50%{opacity:.22}}
  .meter{height:6px;background:var(--soft);border-radius:100px;overflow:hidden;position:relative}
  .meter i{display:block;height:100%;width:0;background:var(--ok);border-radius:100px;transition:width .07s linear}
  .meterMark{position:absolute;top:0;bottom:0;width:1px;background:rgba(0,0,0,.14)}
  .meterHint{font-size:12px;color:var(--ink3);margin-top:7px}

  /* 结果 */
  .panel{margin-top:34px;border-top:1px solid var(--hair);padding-top:26px}
  .empty{color:var(--ink3);font-size:14px;text-align:center;padding:16px 0}
  .sech{
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
    font-size:13px;color:var(--ink3);letter-spacing:.01em;margin:26px 0 12px;
  }
  .sech:first-child{margin-top:0}
  .sech .lg{font-size:12px}

  .bars{display:flex;align-items:flex-end;gap:8px;padding:0 2px}
  .barBox{flex:1;display:flex;flex-direction:column;align-items:center}
  .barVal{font-size:11.5px;color:var(--ink2);margin-bottom:6px;font-variant-numeric:tabular-nums}
  .barVal i{font-style:normal;color:var(--ink3);font-size:10.5px}
  .barPlot{display:flex;align-items:flex-end;justify-content:center;gap:4px;width:100%;height:104px}
  .bar{flex:1 1 0;max-width:16px;min-width:4px;border-radius:4px 4px 1px 1px;background:var(--ink);min-height:3px}
  .bar.good{background:#2f8f5b}
  .bar.mid{background:#d99a23}
  .bar.bad{background:var(--bad)}
  .bar.plain{background:var(--ink)}
  .barStd{flex:1 1 0;max-width:16px;min-width:4px;border-radius:4px 4px 1px 1px;background:#dde1e6;min-height:3px}
  .barLab{font-size:13px;color:var(--ink);margin-top:8px}
  .barSub{font-size:10.5px;color:var(--ink3)}

  canvas{width:100%;height:auto;display:block}

  ul.tips{list-style:none;padding:0;margin:0}
  ul.tips li{
    display:flex;gap:11px;padding:13px 0;border-top:1px solid var(--hair);
    font-size:14.5px;line-height:1.45;text-align:left;
  }
  ul.tips li:first-child{border-top:none;padding-top:4px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink3);margin-top:9px;flex:none}
  .dot.ok{background:var(--ok)}
  .dot.no{background:var(--bad)}
  .tips small{display:block;color:var(--ink3);font-size:12.5px;margin-top:2px}

  footer{margin-top:40px;padding-top:20px;border-top:1px solid var(--hair);
         color:var(--ink3);font-size:11.5px;line-height:1.75;text-align:center}

  /* ---------- 动效 ---------- */
  @keyframes fUp{from{opacity:0;transform:translateY(9px)}to{opacity:1;transform:translateY(0)}}
  @keyframes growY{from{transform:scaleY(.04)}to{transform:scaleY(1)}}

  header,.lessons,.stage{animation:fUp .5s cubic-bezier(.22,.7,.3,1) both}
  .lessons{animation-delay:70ms}
  .stage{animation-delay:140ms}

  .morae span{animation:fUp .34s cubic-bezier(.22,.7,.3,1) both}
  .bars .barBox{animation:fUp .38s cubic-bezier(.22,.7,.3,1) both}
  .bars .bar{transform-origin:bottom;animation:growY .5s cubic-bezier(.22,.7,.3,1) both}
  .bars .barStd{transform-origin:bottom;animation:growY .5s cubic-bezier(.22,.7,.3,1) both}
  ul.tips li{animation:fUp .34s cubic-bezier(.22,.7,.3,1) both}
  #meterWrap.on{animation:fUp .3s cubic-bezier(.22,.7,.3,1) both}

  @media (max-width:420px){
    .wrap{padding:20px 16px 48px}
    .actions{gap:8px}
    .primary{padding:14px 34px}
    .secondary{padding:13px 18px;font-size:14px}
  }

  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{
      animation-duration:.01ms!important;animation-delay:0s!important;
      transition-duration:.01ms!important;scroll-behavior:auto!important;
    }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>单词纠音</h1>
    <div class="lead">先听标准音，再自己读。</div>
  </header>

  <nav class="lessons" id="chips"></nav>

  <section class="stage">
    <span class="kanji" id="kanji">—</span>
    <span class="kana" id="kana"></span>
    <span class="acc" id="acc"></span>
    <div class="morae" id="moraRow"></div>

    <div class="actions">
      <button class="primary" id="recBtn">录音</button>
      <button class="secondary" id="refBtn">听标准</button>
      <button class="secondary" id="nextBtn">换一个</button>
    </div>
    <span class="status" id="status"></span>

    <div id="meterWrap">
      <div class="meterTop"><span class="pulse"></span><span id="recTime">正在录音 0.0 秒</span></div>
      <div class="meter"><i id="meterBar"></i><span class="meterMark" style="left:18%"></span></div>
      <div class="meterHint" id="meterHint">出声，让这个条动起来</div>
    </div>
  </section>

  <section class="panel" id="resultCard">
    <div class="empty" id="emptyTip">点「录音」，读完这个词再点一次结束。</div>
    <div id="resultBody" style="display:none">
      <div class="sech">
        <span>每拍时长 <span class="lg">彩条＝你　灰条＝标准</span></span>
        <button class="secondary" id="playBtn" style="padding:6px 14px;font-size:12.5px">听我的</button>
      </div>
      <div class="bars" id="bars"></div>

      <div class="sech"><span>音高</span><span class="lg">实线＝你　虚线＝标准</span></div>
      <canvas id="pitch" width="1440" height="420"></canvas>

      <div class="sech"><span>反馈</span></div>
      <ul class="tips" id="tips"></ul>
    </div>
  </section>

  <footer id="foot"></footer>
</div>

<script>
/* MFCC 特征按课懒加载：手机上不必一上来就下 2.6MB */
var _mfccPending = {};
function ensureMfcc(n){
  if (window.MFCC && window.MFCC[n]) return Promise.resolve();
  if (_mfccPending[n]) return _mfccPending[n];
  _mfccPending[n] = new Promise(function(resolve){
    var el = document.createElement("script");
    el.src = "mfcc_l" + n + ".js";
    el.onload = resolve;
    el.onerror = resolve;
    document.head.appendChild(el);
  });
  return _mfccPending[n];
}
</script>
<script>
var REG = window.LESSONS || {};
var LESSONS = Object.keys(REG).map(Number).sort(function(a,b){ return a-b; });
var WORDS = [];
LESSONS.forEach(function(n){
  REG[n].forEach(function(w){ w.lesson = n; WORDS.push(w); });
});

var curLesson = 0;   // 0 = 全部
var cur = null;
var recorder = null, chunks = [], stream = null, live = false, stopTimer = 0;
var acCtx = null, analyser = null, meterSrc = null, rafId = 0, recStart = 0;
var lastBlob = null, lastUrl = null, lastMatch = null;
var refAudio = new Audio();
refAudio.preload = "auto";          // 手机多半会忽略，但桌面能少等一下
refAudio.onerror = function(){
  var n = refAudio.getAttribute("data-src");
  if (n) status("打不开 " + n, true);
};

/* 换词时让字浮上来一点。系统开了「减弱动态效果」就什么都不做。 */
var calm = !!(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
function lift(el, dy, ms){
  if (calm || !el || !el.animate) return;
  if (el._lift) el._lift.cancel();
  el._lift = el.animate(
    [{opacity:0, transform:"translateY(" + (dy || 9) + "px)"},
     {opacity:1, transform:"translateY(0)"}],
    {duration:ms || 340, easing:"cubic-bezier(.22,.7,.3,1)"}
  );
}

/* ---------------- 词库 ---------------- */
function buildChips(){
  var box = document.getElementById("chips");
  box.innerHTML = "";
  var items = [{v:0, t:"全部"}];
  LESSONS.forEach(function(n){ items.push({v:n, t:"第 " + n + " 课"}); });
  items.forEach(function(it){
    var b = document.createElement("button");
    b.className = "chip" + (it.v===curLesson ? " on" : "");
    b.textContent = it.t;
    b.onclick = function(){
      if (live) stopRec();
      curLesson = it.v; buildChips(); nextWord();
      var on = box.querySelector ? box.querySelector(".chip.on") : null;
      if (on && on.scrollIntoView)
        on.scrollIntoView({block:"nearest", inline:"center", behavior: calm ? "auto" : "smooth"});
    };
    box.appendChild(b);
  });
}

function pool(){
  if (curLesson === 0) return WORDS;
  return WORDS.filter(function(w){ return w.lesson === curLesson; });
}

function nextWord(){
  if (live) stopRec();
  var p = pool();
  if (!p.length){ status("这一类里还没有词", true); return; }
  var w;
  do { w = p[Math.floor(Math.random()*p.length)]; } while (p.length>1 && cur && w === cur);
  cur = w;
  var kj = document.getElementById("kanji");
  var kn = document.getElementById("kana");
  kj.textContent = w.kanji;
  kn.textContent  = w.kana;
  var ac = document.getElementById("acc");
  ac.textContent = "第 " + w.lesson + " 课";
  lift(kj, 13, 400);
  lift(kn, 9, 400);
  lift(ac, 5, 400);

  var row = document.getElementById("moraRow");
  row.innerHTML = "";
  w.mora.forEach(function(m, i){
    var s = document.createElement("span");
    s.innerHTML = "<b>" + m + "</b>";
    s.style.animationDelay = (70 + i * 34) + "ms";
    row.appendChild(s);
  });
  var cnt = document.createElement("span");
  cnt.style.color = "#8a929c";
  cnt.style.animationDelay = (70 + w.mora.length * 34) + "ms";
  cnt.textContent = w.mora.length + " 拍";
  row.appendChild(cnt);
  lastMatch = null;
  if (typeof ensureMfcc === "function") ensureMfcc(cur.lesson);
  primeRef(w);
  resetResult();
}

/* 换词时先把这一课的录音挂上去。等用户点「聽標準」时文件已经在内存里，
   play() 就能在点击的同一个动作里同步调用——iOS 上延迟调用会被拦掉。 */
function primeRef(w){
  if (!w || !w.src) return;
  if (refAudio.getAttribute("data-src") === w.src) return;
  refAudio.setAttribute("data-src", w.src);
  refAudio.src = w.src;
  refAudio.load();
}

/* ---------------- 状态与提示音 ---------------- */
function status(t, err){
  var s = document.getElementById("status");
  var nt = t || "";
  if (s.textContent !== nt && !calm && s.animate){
    if (s._fade) s._fade.cancel();
    s._fade = s.animate([{opacity:0},{opacity:1}], {duration:190, easing:"ease-out"});
  }
  s.textContent = nt;
  s.className = "status" + (err ? " err" : "");
}

function ensureAC(){
  if (!acCtx){
    var C = window.AudioContext || window.webkitAudioContext;
    acCtx = new C();
  }
  if (acCtx.state === "suspended") acCtx.resume();
  return acCtx;
}

function tone(freq, dur, delay){
  try{
    var c = ensureAC();
    var t = c.currentTime + (delay || 0);
    var o = c.createOscillator(), g = c.createGain();
    o.type = "sine"; o.frequency.value = freq;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.03);
  }catch(e){}
}

/* ---------------- 标准录音 ---------------- */
var refTimer = 0;
function playRef(){
  if (!cur || !cur.src){ status("这个词没有录音", true); return; }
  clearTimeout(refTimer);

  var name = cur.src;
  if (refAudio.error) refAudio.removeAttribute("data-src");   // 上次失败了，重来一次
  primeRef(cur);

  // 先暂停再播，同一个词连点也能从头开始
  refAudio.pause();

  // 关键：play() 必须现在调，还在这次点击里。手机上不给预下载，
  // 文件没到之前就从播放器起播，等元数据到了再定位到那个词。
  var p = refAudio.play();

  var seek = function(){
    try { refAudio.currentTime = cur.start; } catch(e){}
    refTimer = setTimeout(function(){ refAudio.pause(); status(""); }, (cur.dur + 0.2) * 1000);
  };

  if (refAudio.readyState >= 1) seek();
  else{
    var once = function(){
      refAudio.removeEventListener("loadedmetadata", once);
      seek();
    };
    refAudio.addEventListener("loadedmetadata", once);
  }

  p.then(function(){
    status("播放标准音…");
  }).catch(function(e){
    if (e && e.name === "NotAllowedError") status("再点一次", true);
    else status("打不开 " + name, true);
  });
}

/* ---------------- 录音 ---------------- */
function startRec(){
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    status("这个浏览器不让你录音", true); return;
  }
  status("请求麦克风…");
  navigator.mediaDevices.getUserMedia({
    audio:{ echoCancellation:false, noiseSuppression:false, autoGainControl:false, channelCount:1 }
  }).then(function(s){
    stream = s;
    chunks = [];
    recorder = new MediaRecorder(s);
    recorder.ondataavailable = function(e){ if (e.data.size) chunks.push(e.data); };
    recorder.onstop = function(){
      var blob = new Blob(chunks, {type: recorder.mimeType || "audio/webm"});
      (stream.getTracks()||[]).forEach(function(t){ t.stop(); });
      stream = null;
      // 提示音放在停录之后，不然会被录进最后半拍
      tone(620, 0.09);
      tone(470, 0.10, 0.11);
      lastBlob = blob;
      decodeAndRun(blob);
    };
    recorder.start();
    live = true;
    recStart = Date.now();
    document.getElementById("recBtn").textContent = "停止";
    document.getElementById("recBtn").classList.add("live");
    document.getElementById("meterWrap").classList.add("on");
    status("");
    startMeter();
    clearTimeout(stopTimer);
    stopTimer = setTimeout(function(){ if (live) stopRec(); }, 4000);
  }).catch(function(e){
    status("拿不到麦克风：" + (e && e.message ? e.message : "被拒绝"), true);
  });
}

function stopRec(){
  clearTimeout(stopTimer);
  if (!recorder || !live) return;
  live = false;
  cancelAnimationFrame(rafId);
  document.getElementById("recBtn").textContent = "录音";
  document.getElementById("recBtn").classList.remove("live");
  document.getElementById("meterWrap").classList.remove("on");
  status("分析中…");
  try { recorder.stop(); } catch(e){ status("录音中断", true); }
}

function startMeter(){
  var acx = ensureAC();
  if (meterSrc){ try { meterSrc.disconnect(); } catch(e){} }
  meterSrc = acx.createMediaStreamSource(stream);
  analyser = acx.createAnalyser();
  analyser.fftSize = 1024;
  meterSrc.connect(analyser);

  var buf = new Float32Array(analyser.fftSize);
  var bar = document.getElementById("meterBar");
  var hint = document.getElementById("meterHint");
  var timeEl = document.getElementById("recTime");
  var loud = 0, shown = 0;

  function tick(){
    if (!live) return;
    analyser.getFloatTimeDomainData(buf);
    var s = 0, pk = 0;
    for (var i=0;i<buf.length;i++){
      var v = buf[i];
      s += v*v;
      if (v > pk) pk = v; else if (-v > pk) pk = -v;
    }
    var lev = Math.sqrt(s/buf.length);
    if (lev > loud) loud = lev;

    // 手机麦克风比电脑灵敏一大截，线性放大会一开口就顶满。
    // 换成 dB 刻度：-50dB 起、-6dB 满，正常说话落在中间。
    var db = 20 * Math.log10(lev + 1e-7);
    var tgt = (db + 50) / 44;
    tgt = tgt < 0 ? 0 : (tgt > 1 ? 1 : tgt);
    shown += (tgt - shown) * (tgt > shown ? 0.55 : 0.11);   // 上得快，落得慢

    var pct = Math.round(shown * 100);
    var clip = pk > 0.985;                                  // 真顶到满刻度才算爆
    bar.style.width = pct + "%";
    bar.style.background = clip ? "#a66e0c" : (pct < 12 ? "#c9d1d9" : "#267a57");
    timeEl.textContent = "正在录音 " + ((Date.now() - recStart)/1000).toFixed(1) + " 秒";
    hint.textContent = loud < 0.01 ? "还没收到声音，凑近麦克风"
                     : (clip ? "离远一点，声音有点爆" : "收到声音了");
    rafId = requestAnimationFrame(tick);
  }
  tick();
}

/* ---------------- 分析 ---------------- */
function decodeAndRun(blob){
  var fr = new FileReader();
  fr.onload = function(){
    ensureAC().decodeAudioData(fr.result).then(function(buf){
      var res = analyse(buf.getChannelData(0), buf.sampleRate, cur);
      if (res.err){ status(res.err, true); return; }
      try { lastMatch = matchWord(buf); } catch(e){ lastMatch = null; }
      status("");
      render(res);
    }).catch(function(){ status("这个录音解不开", true); });
  };
  fr.readAsArrayBuffer(blob);
}

function down16(data, sr){
  if (sr <= 16000) return {x:data, sr:sr};
  var f = Math.round(sr/16000), n = Math.floor(data.length/f), out = new Float32Array(n);
  for (var i=0;i<n;i++){
    var s = 0;
    for (var j=0;j<f;j++) s += data[i*f+j];
    out[i] = s/f;
  }
  return {x:out, sr:sr/f};
}

function rms(x, a, b){
  var s = 0;
  for (var i=a;i<b;i++) s += x[i]*x[i];
  return Math.sqrt(s/(b-a||1));
}

function acf(x,a,b,lag,r0){
  if (lag < 1) return 0;
  var s=0, n=b-a;
  for (var i=0;i<n-lag;i++) s += x[a+i]*x[a+i+lag];
  return s/r0;
}

/* YIN：累积均值归一化差分，比自相关抗倍频 */
function f0frame(x, a, b, sr){
  var n = b - a;
  var minLag = Math.max(2, Math.floor(sr / 450));
  var maxLag = Math.min(n - 3, Math.floor(sr / 75));
  if (maxLag <= minLag + 2) return 0;

  var d = new Float32Array(maxLag + 2);
  var tau, i, sum, df;
  for (tau = minLag; tau <= maxLag; tau++){
    sum = 0;
    for (i = 0; i < n - tau; i++){
      df = x[a + i] - x[a + i + tau];
      sum += df * df;
    }
    d[tau] = sum;
  }

  var dn = new Float32Array(maxLag + 2);
  var run = 0;
  for (tau = minLag; tau <= maxLag; tau++){
    run += d[tau];
    dn[tau] = run > 1e-12 ? d[tau] * (tau - minLag + 1) / run : 1;
  }

  var best = -1;
  for (tau = minLag + 1; tau < maxLag; tau++){
    if (dn[tau] < 0.15){
      while (tau + 1 < maxLag && dn[tau + 1] < dn[tau]) tau++;
      best = tau;
      break;
    }
  }
  if (best < 0){
    var mn = 1e9;
    for (tau = minLag; tau <= maxLag; tau++) if (dn[tau] < mn){ mn = dn[tau]; best = tau; }
    if (mn > 0.42) return 0;
  }

  var y0 = dn[best - 1] || 0, y1 = dn[best], y2 = dn[best + 1] || 0;
  var den = y0 - 2 * y1 + y2;
  var sh = Math.abs(den) > 1e-12 ? 0.5 * (y0 - y2) / den : 0;
  if (Math.abs(sh) > 1) sh = 0;
  return sr / (best + sh);
}

function speechSpan(x, sr){
  var hop = Math.floor(sr*0.01), win = Math.floor(sr*0.03);
  var n = Math.floor((x.length-win)/hop);
  if (n < 4) return null;
  var mx = 0, env = new Float32Array(n);
  for (var i=0;i<n;i++){
    env[i] = rms(x, i*hop, i*hop+win);
    if (env[i] > mx) mx = env[i];
  }
  if (mx < 0.004) return null;
  var th = mx*0.06, first=-1, last=-1;
  for (var i=0;i<n;i++){ if (env[i] > th){ first=i; break; } }
  for (var i=n-1;i>=0;i--){ if (env[i] > th){ last=i; break; } }
  if (first < 0 || last <= first) return null;
  return {a:first*hop, b:last*hop+win};
}

function splitSegs(x, sr, a, b, k){
  if (k <= 1) return [[a,b]];
  var hop = Math.floor(sr*0.005), win = Math.floor(sr*0.02);
  var n = Math.floor((b-a-win)/hop) + 1;
  var e = new Float32Array(n);
  for (var i=0;i<n;i++) e[i] = rms(x, a+i*hop, a+i*hop+win);
  var cuts = [];
  for (var s=1;s<k;s++){
    var target = Math.round(n*s/k);
    var span = Math.max(3, Math.round(n/(k*4)));
    var lo = Math.max(1, target-span), hi = Math.min(n-2, target+span);
    var bi = target, bv = 1e9;
    for (var i=lo;i<=hi;i++){ if (e[i] < bv){ bv = e[i]; bi = i; } }
    cuts.push(bi);
  }
  cuts.sort(function(p,q){ return p-q; });
  var bounds = [0];
  cuts.forEach(function(c){ if (c > bounds[bounds.length-1]) bounds.push(c); });
  bounds.push(n-1);
  var segs = [];
  for (var s=0;s<bounds.length-1;s++) segs.push([a+bounds[s]*hop, a+bounds[s+1]*hop]);
  return segs;
}

/* 段内最响的一小段的电平。手机 AGC 会把开口压下去，
   整段取平均会偏低，取最响的那 20ms 更接近真实的出声大小 */
function segLevel(x, a, b, sr){
  var win = Math.max(8, Math.round(sr*0.02)), hop = Math.max(4, Math.round(win/2));
  var best = 0;
  for (var p = a; p + win <= b; p += hop){
    var r = rms(x, p, p + win);
    if (r > best) best = r;
  }
  return best || rms(x, a, b);
}

/* 按参考录音每拍的真实时长比例做切分，切点仍尽量落在能量谷。
   「均分后找附近最低点」默认各拍差不多长，长音、促音、拨音就被切错；
   这里把标准录音的比例当先验，用动态规划选最省的一条切法。 */
var DP_LEN = 1.2;    // 时长偏离参考的权重（太大就只会照着参考比例切，反而切错）
var DP_CUT = 0.4;    // 切点落在能量高处的罚分
var USE_DP = 1;      // 0 就退回旧的均分切法

function splitSegsDP(x, sr, a, b, k, refDur){
  if (k <= 1) return [[a, b]];
  if (!refDur || refDur.length !== k) return null;

  var hop = Math.floor(sr*0.005), win = Math.floor(sr*0.02);
  var n = Math.floor((b-a-win)/hop) + 1;
  if (n < k * 2) return null;

  var e = new Float32Array(n), mx = 0;
  for (var i=0;i<n;i++){
    e[i] = rms(x, a+i*hop, a+i*hop+win);
    if (e[i] > mx) mx = e[i];
  }
  if (mx <= 0) return null;

  var tot = 0;
  for (var i=0;i<k;i++) tot += refDur[i];
  var p = [];
  for (var i=0;i<k;i++) p.push(refDur[i]/tot);

  // 每拍允许的长度范围，防止某一拍被拉成一大块
  var lo = [], hi = [];
  for (var i=0;i<k;i++){
    lo.push(Math.max(1, Math.floor(n * p[i] * 0.4)));
    hi.push(Math.max(2, Math.ceil(n * p[i] * 2.6)));
  }

  var INF = 1e18;
  var dp = [], bk = [];
  for (var i=0;i<=k;i++){
    dp.push(new Float64Array(n+1).fill(INF));
    bk.push(new Int32Array(n+1).fill(-1));
  }
  dp[0][0] = 0;

  for (var i=1;i<=k;i++){
    var ex = n * p[i-1];
    for (var j=1;j<=n;j++){
      var s0 = Math.max(0, j - hi[i-1]), s1 = j - lo[i-1];
      if (s1 < s0) continue;
      var cutC = (i < k) ? DP_CUT * (e[j-1] / mx) : 0;
      var bestV = INF, bestS = -1;
      for (var s=s0; s<=s1; s++){
        var base = dp[i-1][s];
        if (base >= INF) continue;
        var d = (j - s) - ex;
        var v = base + DP_LEN * (d*d) / (ex*ex + 1) + cutC;
        if (v < bestV){ bestV = v; bestS = s; }
      }
      dp[i][j] = bestV; bk[i][j] = bestS;
    }
  }

  if (dp[k][n] >= INF) return null;

  var cut = new Array(k + 1);
  cut[k] = n;
  var j = n;
  for (var i=k;i>=1;i--){
    cut[i-1] = bk[i][j];
    if (cut[i-1] < 0) return null;
    j = cut[i-1];
  }
  if (j !== 0) return null;

  var segs = [];
  for (var i=0;i<k;i++)
    segs.push([a + cut[i]*hop, a + cut[i+1]*hop]);
  return segs;
}

function analyse(x0, sr0, word){
  var r = down16(x0, sr0), x = r.x, sr = r.sr;
  var span = speechSpan(x, sr);
  if (!span) return {err:"没听到声音，再读一次"};
  var dur = (span.b - span.a) / sr;
  if (dur < 0.18) return {err:"太短了，整个词读完再停"};
  if (dur > 3.0)  return {err:"太长了，一次只读一个词"};

  var k = word.mora.length;
  var segs = USE_DP ? splitSegsDP(x, sr, span.a, span.b, k, word.refDur) : null;
  if (!segs) segs = splitSegs(x, sr, span.a, span.b, k);

  var morae = [];
  for (var s=0;s<segs.length;s++){
    var a = segs[s][0], b = segs[s][1];
    var win = Math.min(Math.floor(sr*0.04), Math.max(Math.floor(sr*0.012), b-a));
    var step = Math.max(1, Math.floor(win/4));
    var f0s = [];
    for (var p=a; p+win<=b; p+=step){
      var f = f0frame(x, p, p+win, sr);
      if (f > 60 && f < 520) f0s.push(f);
    }
    f0s.sort(function(u,v){ return u-v; });
    morae.push({
      kana: word.mora[s],
      ms: Math.round((b-a)/sr*1000),
      amp: segLevel(x, a, b, sr),
      f0: f0s.length ? f0s[Math.floor(f0s.length/2)] : 0
    });
  }

  // 能量太低当成无声。门槛别卡太高：手机录同一句话，各拍音量本来就不齐，
  // 卡在 0.28 会把真读了但稍轻的一拍判成没读。
  var amps = morae.map(function(m){ return m.amp; }).filter(function(v){ return v>0; }).sort(function(u,v){ return u-v; });
  var ampMed = amps.length ? amps[Math.floor(amps.length/2)] : 0;
  morae.forEach(function(m){
    m.silent = ampMed > 0 && m.amp <= ampMed*0.05;
    m.voiced = !m.silent && m.f0 > 0;     // voiced 只决定参不参与音高
    if (m.silent) m.f0 = 0;
  });

  // 拍子的基准用「真出了声的拍」。音高没测出来不等于没读，不能把它踢出基准
  var beats = morae.filter(function(m){ return !m.silent && m.kana !== "っ"; })
                   .map(function(m){ return m.ms; }).sort(function(u,v){ return u-v; });
  var beat = beats.length ? beats[Math.floor(beats.length/2)] : 1;
  morae.forEach(function(m){ m.ratio = m.ms / beat; });

  var logs = morae.filter(function(m){ return m.voiced; }).map(function(m){ return Math.log(m.f0); });
  var base = logs.length ? logs.reduce(function(p,q){ return p+q; },0)/logs.length : 0;
  morae.forEach(function(m){
    m.semi = m.voiced ? 12*(Math.log(m.f0)-base)/Math.LN2 : null;
  });

  return {morae:morae, beat:beat, dur:dur};
}

/* ---------------- 渲染 ---------------- */
function resetResult(){
  document.getElementById("emptyTip").style.display = "";
  document.getElementById("resultBody").style.display = "none";
}

/* 这一拍和标准差多少拍。柱子上写的就是拍数，差 0.25 拍就是 0.25，
   这样颜色和数字对得上，不用换算。 */
var DEV_OK = 0.15, DEV_OFF = 0.35;

function devOf(m, r){
  if (!r) return 0;
  return m.ratio - r;
}

function bandCls(dv){
  if (Math.abs(dv) <= DEV_OK) return " good";
  if (Math.abs(dv) <= DEV_OFF) return " mid";
  return " bad";
}

function render(res){
  document.getElementById("emptyTip").style.display = "none";
  var body = document.getElementById("resultBody");
  body.style.display = "";
  lift(body, 11, 430);

  var ref = cur.refRatio || [];
  var box = document.getElementById("bars");
  box.innerHTML = "";
  var mx = 1.2;
  res.morae.forEach(function(m,i){
    mx = Math.max(mx, m.ratio, ref[i] || 0);
  });
  res.morae.forEach(function(m,i){
    var r = ref[i];
    var dv = devOf(m, r);
    var h = Math.max(5, Math.round(m.ratio/mx * 96));
    var rh = r ? Math.max(4, Math.round(r/mx * 96)) : 0;
    var d = (90 + i*46) + "ms";
    var w = document.createElement("div");
    w.className = "barBox";
    w.style.animationDelay = d;
    w.innerHTML =
      '<div class="barVal">' + m.ratio.toFixed(2) + (r ? ' <i>/ ' + r.toFixed(2) + '</i>' : '') + '</div>' +
      '<div class="barPlot">' +
        '<div class="bar' + (r ? bandCls(dv) : " plain") + '" style="height:' + h + 'px;animation-delay:' + d + '"></div>' +
        (r ? '<div class="barStd" style="height:' + rh + 'px;animation-delay:' + d + '"></div>' : '') +
      '</div>' +
      '<div class="barLab">' + m.kana + '</div>' +
      '<div class="barSub">' + m.ms + 'ms</div>';
    box.appendChild(w);
  });

  drawPitch(res);
  renderTips(res);
}

function drawPitch(res){
  var cv = document.getElementById("pitch");
  var g = cv.getContext("2d");
  var W = cv.width, H = cv.height, padL = 60, padR = 36, padT = 30, padB = 46;
  g.clearRect(0,0,W,H);

  var n = res.morae.length;
  var refSemi = cur.refSemi || [];
  var vals = [];
  res.morae.forEach(function(m){ if (m.semi !== null) vals.push(m.semi); });
  refSemi.forEach(function(v){ if (v !== null && v !== undefined) vals.push(v); });
  if (!vals.length) return;

  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi-lo < 4){ lo -= 2; hi += 2; }
  var pad = (hi-lo)*0.2; lo -= pad; hi += pad;

  function X(i){ return padL + (W-padL-padR)*(n===1?0.5:i/(n-1)); }
  function Y(v){ return H-padB - (H-padT-padB)*((v-lo)/(hi-lo)); }

  // 标准：灰虚线
  g.setLineDash([7,7]); g.lineWidth = 3; g.strokeStyle = "#9aa4b0";
  g.beginPath();
  var on = false;
  for (var i=0;i<n;i++){
    var v = refSemi[i];
    if (v === null || v === undefined){ on = false; continue; }
    if (!on){ g.moveTo(X(i), Y(v)); on = true; } else g.lineTo(X(i), Y(v));
  }
  g.stroke(); g.setLineDash([]);

  // 你：蓝线
  g.strokeStyle = "#2f6fb2"; g.lineWidth = 4; g.lineJoin = "round";
  g.beginPath();
  on = false;
  for (var i=0;i<n;i++){
    var m = res.morae[i];
    if (m.semi === null){ on = false; continue; }
    if (!on){ g.moveTo(X(i), Y(m.semi)); on = true; } else g.lineTo(X(i), Y(m.semi));
  }
  g.stroke();

  g.font = "22px Microsoft YaHei, sans-serif";
  g.textAlign = "center";
  for (var i=0;i<n;i++){
    var m = res.morae[i];
    if (m.semi !== null){
      g.fillStyle = "#2f6fb2";
      g.beginPath(); g.arc(X(i), Y(m.semi), 7, 0, 7); g.fill();
    }
    g.fillStyle = "#5b6470";
    g.fillText(m.kana, X(i), H-14);
  }

  g.fillStyle = "#b9c1ca"; g.font = "17px Microsoft YaHei, sans-serif";
  g.fillText("只看高低走向，不比绝对音高", W/2, padT-8);
}

function renderTips(res){
  var ul = document.getElementById("tips");
  ul.innerHTML = "";
  var msgs = [];
  var ref = cur.refRatio || [];

  // 逐拍和标准比，只挑出偏得明显的
  var offs = [];
  res.morae.forEach(function(m,i){
    if (m.silent){
      offs.push({c:"no", t:"「" + m.kana + "」几乎没声音", s:"这一拍要发出来"});
      return;
    }
    var r = ref[i];
    if (!r) return;
    var dv = devOf(m, r);
    if (Math.abs(dv) <= DEV_OFF) return;
    var shortY = dv < 0;
    offs.push({
      c:"no",
      t:"「" + m.kana + "」" + (shortY ? "偏短" : "偏长"),
      s:"你 " + m.ratio.toFixed(2) + " 拍，标准 " + r.toFixed(2) + " 拍，" +
        (m.kana === "っ" ? (shortY ? "停久一点" : "停短一点")
                         : (shortY ? "再拖住一点" : "收快一点"))
    });
  });

  // 声调先算：下面判断要不要提“没听清”要用到，音高差不多就不提
  var refSemi = cur.refSemi || [];
  var pairs = [];
  for (var i = 0; i < res.morae.length; i++){
    var u = res.morae[i].semi, rf = refSemi[i];
    if (u !== null && u !== undefined && rf !== null && rf !== undefined)
      pairs.push([u, rf, res.morae[i].kana]);
  }
  var pitchMsg = null, pitchOk = true;
  if (pairs.length >= 2){
    var mx = 0, my = 0;
    pairs.forEach(function(p){ mx += p[0]; my += p[1]; });
    mx /= pairs.length; my /= pairs.length;
    var sxy = 0, sxx = 0, syy = 0;
    pairs.forEach(function(p){
      var A = p[0] - mx, B = p[1] - my;
      sxy += A * B; sxx += A * A; syy += B * B;
    });
    var r = (sxx > 1e-9 && syy > 1e-9) ? sxy / Math.sqrt(sxx * syy) : 1;
    var flip = pairs.filter(function(p){
      return (p[0] - mx) * (p[1] - my) < 0 && Math.abs(p[0] - p[1]) > 2.5;
    }).map(function(p){ return p[2]; });
    if (flip.length >= Math.max(3, Math.ceil(pairs.length * 0.75))){
      pitchOk = false;
      pitchMsg = {c:"no", t:"声调高低和标准反了：" + flip.join("、"),
                  s:"这几拍的高低走向和标准相反"};
    } else if (r < 0){
      pitchOk = false;
      pitchMsg = {c:"no", t:"声调走向和标准不一致",
                  s:"比了 " + pairs.length + " 拍，起伏对不上"};
    } else {
      pitchMsg = {c:"ok", t:"声调走向和标准接近",
                  s:"比了 " + pairs.length + " 拍"};
    }
  }

  if (lastMatch){
    var tm = lastMatch;
    if (tm.top.k === cur.kanji && tm.top.y === cur.kana)
      msgs.unshift({c:"ok", t:"听的就是这个词", s:"和标准录音对上了"});
    else if (tm.sure)
      msgs.unshift({c:"no", t:"听起来像「" + tm.top.k + "」",
                    s:"不是「" + cur.kanji + "」，再读一遍"});
    else if (!pitchOk && (tm.own === null || tm.own > 1.6) && (!tm.top || tm.top.d > 1.4))
      msgs.unshift({c:"no", t:"这段没听清", s:"离麦克风近一点，整个词读完再停"});
    // 只是恰好有点像别的词，不足以断言，就不提，免得指到一个八竿子打不着的词
  }

  if (!offs.length)
    msgs.push({c:"ok", t:"每拍长短和标准接近", s:"比了 " + res.morae.length + " 拍"});
  else
    offs.slice(0,3).forEach(function(o){ msgs.push(o); });

  if (pitchMsg) msgs.push(pitchMsg);

  msgs.slice(0,6).forEach(function(o, i){
    var li = document.createElement("li");
    li.style.animationDelay = (140 + i*50) + "ms";
    li.innerHTML = '<span class="dot ' + o.c + '"></span><div>' + o.t +
                   '<small>' + o.s + '</small></div>';
    ul.appendChild(li);
  });
}

/* ================= 二期：判断读的是不是这个词 =================
   参考侧的特征由 Python 预先算好（浏览器在 file:// 下拿不到本地音频的采样）。
   这里只算用户这一段的特征，然后和本课所有词做 DTW 比对。          */
var SR_MF = 16000, FLEN_MF = 400, HOP_MF = 160, NFFT_MF = 512, NMEL_MF = 26, NCEP = 12;

var FB_MF = (function(){
  function hz2mel(f){ return 2595 * Math.log10(1 + f / 700); }
  function mel2hz(m){ return 700 * (Math.pow(10, m / 2595) - 1); }
  var n = NMEL_MF + 2, pts = [], i;
  var a = hz2mel(0), b = hz2mel(SR_MF / 2);
  for (i = 0; i < n; i++) pts.push(mel2hz(a + (b - a) * i / (n - 1)));
  var bins = pts.map(function(f){ return Math.floor((NFFT_MF + 1) * f / SR_MF); });
  var fb = [];
  for (i = 0; i < NMEL_MF; i++) fb.push(new Float64Array(NFFT_MF / 2 + 1));
  for (var m = 1; m <= NMEL_MF; m++){
    var l = bins[m - 1], c = bins[m], r = bins[m + 1];
    for (var k = l; k < c; k++) fb[m - 1][k] = (k - l) / Math.max(1, c - l);
    for (var k2 = c; k2 < r; k2++) fb[m - 1][k2] = (r - k2) / Math.max(1, r - c);
  }
  return fb;
})();

var DCT_MF = (function(){
  var d = [];
  for (var i = 0; i < NCEP; i++){
    var row = new Float64Array(NMEL_MF);
    for (var j = 0; j < NMEL_MF; j++)
      row[j] = Math.cos(Math.PI * (i + 1) * (j + 0.5) / NMEL_MF) * Math.sqrt(2 / NMEL_MF);
    d.push(row);
  }
  return d;
})();

var WIN_MF = (function(){
  var w = new Float64Array(FLEN_MF);
  for (var i = 0; i < FLEN_MF; i++) w[i] = 0.54 - 0.46 * Math.cos(2 * Math.PI * i / (FLEN_MF - 1));
  return w;
})();

var COS_T = new Float64Array(NFFT_MF / 2), SIN_T = new Float64Array(NFFT_MF / 2);
for (var _q = 0; _q < NFFT_MF / 2; _q++){
  COS_T[_q] = Math.cos(-2 * Math.PI * _q / NFFT_MF);
  SIN_T[_q] = Math.sin(-2 * Math.PI * _q / NFFT_MF);
}

function fft512(re, im){
  var n = re.length, i, j, t;
  for (i = 1, j = 0; i < n; i++){
    var bit = n >> 1;
    for (; j & bit; bit >>= 1) j ^= bit;
    j ^= bit;
    if (i < j){ t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (var len = 2; len <= n; len <<= 1){
    var half = len >> 1, step = n / len;
    for (i = 0; i < n; i += len){
      for (var k = 0; k < half; k++){
        var idx = k * step;
        var wr = COS_T[idx], wi = SIN_T[idx];
        var ur = re[i + k], ui = im[i + k];
        var vr = re[i + k + half] * wr - im[i + k + half] * wi;
        var vi = re[i + k + half] * wi + im[i + k + half] * wr;
        re[i + k] = ur + vr; im[i + k] = ui + vi;
        re[i + k + half] = ur - vr; im[i + k + half] = ui - vi;
      }
    }
  }
}

function trimQuiet(y, sr){
  var hop = Math.round(sr * 0.01), win = Math.round(sr * 0.025);
  var n = Math.floor((y.length - win) / hop);
  if (n < 3) return y;
  var e = new Float32Array(n), mx = 0;
  for (var i = 0; i < n; i++){
    var s2 = 0;
    for (var j = 0; j < win; j++){ var v = y[i * hop + j]; s2 += v * v; }
    e[i] = Math.sqrt(s2 / win);
    if (e[i] > mx) mx = e[i];
  }
  if (mx < 1e-4) return y;
  var th = mx * 0.06, a = -1, b = -1;
  for (var i2 = 0; i2 < n; i2++){ if (e[i2] > th){ a = i2; break; } }
  for (var i3 = n - 1; i3 >= 0; i3--){ if (e[i3] > th){ b = i3; break; } }
  if (a < 0 || b <= a) return y;
  var pad = Math.round(sr * 0.05);
  return y.subarray(Math.max(0, a * hop - pad), Math.min(y.length, b * hop + win + pad));
}

function to16k(x, sr){
  if (sr === SR_MF) return x;
  var m = Math.floor(x.length * SR_MF / sr), out = new Float32Array(m);
  for (var i = 0; i < m; i++){
    var pos = i * (x.length - 1) / (m - 1);
    var a = Math.floor(pos), b = Math.min(x.length - 1, a + 1);
    out[i] = x[a] + (x[b] - x[a]) * (pos - a);
  }
  return out;
}

function mfccOf(y0, sr0){
  var y = to16k(y0, sr0);
  if (y.length < FLEN_MF) return null;
  var pre = new Float64Array(y.length);
  pre[0] = y[0];
  for (var i = 1; i < y.length; i++) pre[i] = y[i] - 0.97 * y[i - 1];
  var nf = Math.floor((y.length - FLEN_MF) / HOP_MF) + 1;
  if (nf < 3) return null;
  var out = [], re = new Float64Array(NFFT_MF), im = new Float64Array(NFFT_MF);
  for (var f = 0; f < nf; f++){
    re.fill(0); im.fill(0);
    var base = f * HOP_MF;
    for (var k = 0; k < FLEN_MF; k++) re[k] = pre[base + k] * WIN_MF[k];
    fft512(re, im);
    var p = new Float64Array(NFFT_MF / 2 + 1);
    for (var b2 = 0; b2 <= NFFT_MF / 2; b2++){
      p[b2] = (re[b2] * re[b2] + im[b2] * im[b2]) / NFFT_MF;
    }
    var fe = new Float64Array(NMEL_MF);
    for (var m2 = 0; m2 < NMEL_MF; m2++){
      var acc = 0, row = FB_MF[m2];
      for (var k3 = 0; k3 <= NFFT_MF / 2; k3++) acc += p[k3] * row[k3];
      fe[m2] = Math.log(acc + 1e-8);
    }
    var c = new Float64Array(NCEP);
    for (var q = 0; q < NCEP; q++){
      var sm = 0, dr = DCT_MF[q];
      for (var z = 0; z < NMEL_MF; z++) sm += fe[z] * dr[z];
      c[q] = sm;
    }
    out.push(c);
  }
  for (var q2 = 0; q2 < NCEP; q2++){
    var sum = 0, sum2 = 0;
    for (var t2 = 0; t2 < nf; t2++){ sum += out[t2][q2]; sum2 += out[t2][q2] * out[t2][q2]; }
    var mean = sum / nf;
    var sd = Math.sqrt(Math.max(1e-9, sum2 / nf - mean * mean));
    for (var t3 = 0; t3 < nf; t3++) out[t3][q2] = (out[t3][q2] - mean) / sd;
  }
  return out;
}

function unpackRef(row){
  var n = row.n, flat = row.m, out = [];
  for (var i = 0; i < n; i++){
    var v = new Float64Array(NCEP);
    for (var c = 0; c < NCEP; c++) v[c] = flat[i * NCEP + c] / 24.0;
    out.push(v);
  }
  return out;
}

function dtwScore(A, B){
  var n = A.length, m = B.length;
  if (!n || !m) return Infinity;
  var band = Math.max(12, Math.round(Math.max(n, m) * 0.25), Math.abs(n - m) + 8);
  var INF = 1e18;
  var prev = new Float64Array(m + 1).fill(INF), cur = new Float64Array(m + 1).fill(INF);
  var plp = new Float64Array(m + 1), plc = new Float64Array(m + 1);
  prev[0] = 0;
  for (var i = 1; i <= n; i++){
    cur.fill(INF); plc.fill(0);
    var lo = Math.max(1, i - band), hi = Math.min(m, i + band);
    for (var j = lo; j <= hi; j++){
      var d = 0, a = A[i - 1], b = B[j - 1];
      for (var c = 0; c < NCEP; c++){ var df = a[c] - b[c]; d += df * df; }
      d = Math.sqrt(d);
      var bp = prev[j - 1], bl = plp[j - 1];
      if (prev[j] < bp){ bp = prev[j]; bl = plp[j]; }
      if (cur[j - 1] < bp){ bp = cur[j - 1]; bl = plc[j - 1]; }
      cur[j] = d + bp; plc[j] = bl + 1;
    }
    var t = prev; prev = cur; cur = t;
    var t2 = plp; plp = plc; plc = t2;
  }
  return prev[m] / Math.max(1, plp[m]);
}

/* 同一个词换个声音念，共振峰位置整体偏移，MFCC 距离会被一起抬高，
   词与词之间就分不开了。把录音整体拉伸几档再比，等于替对方换个声道长度，
   取最像的那一档。第一档就够像的时候不走后面几档。 */
var WARPS = [1, 0.9, 0.8, 0.7, 0.62, 1.1, 1.2];

function warpBy(x, f){
  if (f === 1) return x;
  var n = Math.round(x.length * f);
  var out = new Float32Array(n);
  for (var i = 0; i < n; i++){
    var pos = i * (x.length - 1) / (n - 1);
    var a = Math.floor(pos), b = Math.min(x.length - 1, a + 1);
    out[i] = x[a] + (x[b] - x[a]) * (pos - a);
  }
  return out;
}

function matchWord(buf){
  var refs = (window.MFCC || {})[cur.lesson];
  if (!refs || !refs.length) return null;
  var raw = trimQuiet(buf.getChannelData(0), buf.sampleRate);
  var sr = buf.sampleRate;
  var un = refs.map(unpackRef);
  var best = null, bestQn = 0, own = null;

  // 屏幕上这个词自己的分数，用来判断赢家是不是真的赢了一大截
  var ownIdx = -1;
  for (var oi = 0; oi < refs.length; oi++){
    if (refs[oi].k === cur.kanji && refs[oi].y === cur.kana){ ownIdx = oi; break; }
  }

  for (var wi = 0; wi < WARPS.length; wi++){
    var feats = mfccOf(warpBy(raw, WARPS[wi]), sr);
    if (!feats || feats.length < 5) break;
    var qn = feats.length;

    var cands = [];
    for (var i = 0; i < refs.length; i++){
      var ratio = refs[i].n / qn;
      if (ratio > 0.45 && ratio < 2.4) cands.push(i);
    }
    if (cands.length < 3){
      cands = [];
      for (var j = 0; j < refs.length; j++) cands.push(j);
    }

    for (var c = 0; c < cands.length; c++){
      var r = refs[cands[c]];
      var d = dtwScore(feats, un[cands[c]]) + 0.06 * Math.abs(r.n - qn) / Math.max(r.n, qn);
      if (!best || d < best.d){ best = { k: r.k, y: r.y, d: d }; bestQn = qn; }
      if (cands[c] === ownIdx && (own === null || d < own)) own = d;
    }

    // 长度过滤把屏幕上这个词筛掉了，单独给它补一次分
    if (ownIdx >= 0 && cands.indexOf(ownIdx) < 0){
      var ro = refs[ownIdx];
      var od = dtwScore(feats, un[ownIdx]) + 0.06 * Math.abs(ro.n - qn) / Math.max(ro.n, qn);
      if (own === null || od < own) own = od;
    }

    if (best && best.d < 1.7) break;
  }

  if (!best) return null;
  var gap = own === null ? 0 : own - best.d;
  // 只有赢家明显更近、而且它自己也确实像，才敢说是另一个词
  var sure = own !== null && gap > 0.4 && own > best.d * 1.35 && best.d < 1.25;
  return { top: best, own: own, gap: gap, sure: sure, qn: bestQn };
}
